name: traefik

# Shared HTTPS gateway for every site on this server (chithhi-api, logs, api.peshkarai.in).
# The dashboard/API is switched off (it was enabled without a host rule or login) and logging is
# at WARN instead of DEBUG.
services:
  traefik:
    image: traefik:v3.7.12
    restart: unless-stopped
    command:
      - "--log.level=WARN"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.cert-resolver.acme.httpchallenge=true"
      - "--certificatesresolvers.cert-resolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.cert-resolver.acme.email=yashovardhans321@gmail.com"
      - "--certificatesresolvers.cert-resolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./certificates/letsencrypt:/letsencrypt"
    ports:
      - "80:80"
      - "443:443"
    networks:
      - traefik
      - project-a-network
      - traefik-dozzle
      - peshkar-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    name: traefik
  project-a-network:
    name: project-a-network
  traefik-dozzle:
    name: traefik-dozzle
  peshkar-network:
    name: peshkar-network
