# Log viewer (Dozzle) at https://logs.yasho.tech, behind Dozzle's own login.
# Before starting, create ./dozzle/users.yml on the server (never commit it, it's gitignored):
#   docker run --rm amir20/dozzle:v10.7.4 generate <user> --password '<password>' --name "<Name>" > dozzle/users.yml
# Full steps: ListingLift docs/runbooks/vm-tuning.md

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  dozzle:
    image: amir20/dozzle:v10.7.4
    restart: unless-stopped
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 48h
    expose:
      - 8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle:/data
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      dozzle:
        condition: service_started
    expose:
      - 80
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.logs-svc.rule=Host(`logs.yasho.tech`)"
      - "traefik.http.services.logs-svc.loadbalancer.server.port=80"
      - "traefik.http.routers.logs-svc.entrypoints=websecure"
      - "traefik.docker.network=traefik-dozzle"
      - "traefik.http.routers.logs-svc.tls=true"
      - "traefik.http.routers.logs-svc.tls.certresolver=cert-resolver"
    networks:
      - internal
      - traefik-dozzle
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 32M

networks:
  internal:
    driver: bridge
  traefik-dozzle:
    external: true
