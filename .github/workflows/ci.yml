name: CI

# Runs on every push and pull request so broken code is caught before merge.
# Runtimes mirror local dev: frontend on Node, backend on Bun, worker on Node.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (Node — lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Not `npm ci` — the committed package-lock.json can lag behind package.json.
      - run: npm install
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (Bun — syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Validates the Bun lockfile resolves; not frozen so added deps don't fail CI.
      - run: bun install
      # No test suite yet — parse every API/shared file to catch syntax errors.
      # `node --check` only validates syntax, so no deps need to be installed for it.
      - run: node --check src/index.js && echo "entry OK"
      - run: |
          for f in $(find src shared -name "*.js" -not -path "*/node_modules/*"); do
            node --check "$f" || exit 1
          done
          echo "all backend files parse"

  worker:
    name: Worker (Node — install + syntax check)
    runs-on: ubuntu-latest
    # The worker is its OWN Node package (backend/worker/package.json), started with
    # `node index.js`. Run the job inside that package so it matches the real process.
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Validates the worker's own package.json + lockfile resolve under Node.
      - run: npm install
      # No test suite yet — parse every worker file to catch syntax errors.
      - run: |
          for f in $(find . -name "*.js" -not -path "*/node_modules/*"); do
            node --check "$f" || exit 1
          done
          echo "all worker files parse"
